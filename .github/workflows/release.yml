name: Release Deploy
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate
        run: pnpm run generate

      - name: Package
        run: cd .output/public && zip -r ../deploy.zip . && cd ..

      - name: Upload to backend
        run: |
          curl -f -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            --data-binary @.output/deploy.zip \
            "${{ secrets.DEPLOY_URL }}/api/deploy"
